<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Viewer – Ad-Free Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ff3c3c;
      --accent2: #ff6b35;
      --text: #f0f0f5;
      --muted: #888;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 60, 60, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255, 107, 53, 0.08), transparent);
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(255, 60, 60, 0.4);
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* ── Input Card ── */
    .input-card {
      width: 100%;
      max-width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      backdrop-filter: blur(20px);
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row input::placeholder {
      color: var(--muted);
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 60, 60, 0.15);
    }

    .btn-play {
      padding: 0.85rem 1.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 20px rgba(255, 60, 60, 0.35);
    }

    .btn-play:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(255, 60, 60, 0.45);
    }

    .btn-play:active {
      transform: translateY(0);
      opacity: 0.9;
    }

    /* ── Player ── */
    .player-wrap {
      width: 100%;
      max-width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      animation: fadeUp 0.4s ease;
    }

    .player-wrap.visible {
      display: flex;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }

    .btn-close:hover {
      background: rgba(255, 60, 60, 0.15);
      color: var(--accent);
    }

    .iframe-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      /* 16:9 */
      background: #000;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Error ── */
    .error-msg {
      display: none;
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 0.6rem;
      padding: 0.6rem 1rem;
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255, 60, 60, 0.2);
      border-radius: 8px;
    }

    /* ── Tips ── */
    .tips {
      margin-top: 1.8rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 820px;
      width: 100%;
    }

    .tip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tip span {
      color: var(--text);
    }

    footer {
      margin-top: auto;
      padding-top: 2.5rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      opacity: 0.5;
    }

    @media (max-width: 520px) {
      .input-row {
        flex-direction: column;
      }

      .btn-play {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M10 15.5l6-3.5-6-3.5v7zm12-3.5A10 10 0 1 1 2 12a10 10 0 0 1 20 0z" />
        </svg>
      </div>
      <h1>YT Viewer</h1>
    </div>
    <p>YouTube link daalo — ads ke bina dekho 🎬</p>
  </header>

  <div class="input-card">
    <div class="input-row">
      <input id="urlInput" type="text" placeholder="YouTube link yahan paste karo… https://youtu.be/..."
        autocomplete="off" spellcheck="false" />
      <button class="btn-play" onclick="loadVideo()">▶ Play</button>
    </div>
    <div class="error-msg" id="errMsg">⚠️ Valid YouTube URL nahi mili. Example: https://youtu.be/dQw4w9WgXcQ</div>
  </div>

  <div class="player-wrap" id="playerWrap">
    <div class="player-header">
      <div class="now-playing">
        <div class="dot"></div>
        Now Playing
      </div>
      <button class="btn-close" onclick="closePlayer()">✕ Close</button>
    </div>
    <div class="iframe-container">
      <iframe id="ytFrame" src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
  </div>

  <div class="tips">
    <div class="tip">🔗 <span>youtu.be/...</span> link works</div>
    <div class="tip">🔗 <span>youtube.com/watch?v=...</span> works</div>
    <div class="tip">⌨️ <span>Enter</span> key bhi kaam karta hai</div>
    <div class="tip">📺 Full-screen bhi kar sako</div>
  </div>

  <footer>Built for personal use · No data stored · 2026</footer>

  <script>
    const input = document.getElementById('urlInput');
    const frame = document.getElementById('ytFrame');
    const wrap = document.getElementById('playerWrap');
    const err = document.getElementById('errMsg');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') loadVideo(); });

    function extractVideoId(url) {
      const patterns = [
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/watch\?(?:.*&)?v=([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/v\/([a-zA-Z0-9_-]{11})/,
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m) return m[1];
      }
      return null;
    }

    function loadVideo() {
      const url = input.value.trim();
      err.style.display = 'none';

      if (!url) { showError(); return; }

      const vid = extractVideoId(url);
      if (!vid) { showError(); return; }

      frame.src = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`;
      wrap.classList.add('visible');
      wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closePlayer() {
      frame.src = '';
      wrap.classList.remove('visible');
      input.value = '';
    }

    function showError() {
      err.style.display = 'block';
      input.style.borderColor = 'var(--accent)';
      setTimeout(() => { input.style.borderColor = ''; err.style.display = 'none'; }, 3000);
    }
  </script>

</body>

</html>
